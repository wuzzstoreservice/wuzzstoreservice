    <circle cx="28" cy="206" r="5" fill="#e34c26"/>
    <text x="42" y="210" fill="#c9d1d9">HTML · Shell · CSS · Other</text>
    <text x="620" y="210" fill="#8b949e" text-anchor="end">10.4%</text>
    <rect x="160" y="201" width="430" height="8" rx="4" fill="#21262d"/>
    <rect x="160" y="201" width="45" height="8" rx="4" fill="#e34c26"/>
